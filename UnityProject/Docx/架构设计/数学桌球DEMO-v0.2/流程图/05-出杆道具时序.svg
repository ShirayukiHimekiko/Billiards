<rect x="492" y="652" width="86" height="26" rx="5" fill="#f8fafd"/><text x="535" y="671" text-anchor="middle" font-size="16" fill="#506079">本杆结束</text>
<rect x="410" y="10" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="42" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">起始：常态</text>
<text x="535" y="70" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">球逐渐变大</text>
<rect x="410" y="150" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">球接触道具</text>
<rect x="410" y="290" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="322" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">保留触发时的大小</text>
<text x="535" y="350" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">不会突然变大或变小</text>
<rect x="410" y="430" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>

<text x="535" y="490" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">球开始逐渐变小</text>
<rect x="410" y="570" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="602" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">道具本杆已使用</text>
<text x="535" y="630" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">白球继续滚动</text>

<text x="535" y="742" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">下一杆</text>
<text x="535" y="770" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">恢复常态和道具可用</text></g><text x="30" y="1007" font-size="15" fill="#7b8797">数学桌球 · 简明版 · 2026-10-04</text></g></svg>
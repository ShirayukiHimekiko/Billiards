<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#63748a"/></marker></defs><rect width="100%" height="100%" fill="#f8fafd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="43" font-size="29" font-weight="700" fill="#172b47">翻转道具怎样生效</text><text x="30" y="77" font-size="18" fill="#5b6c82">道具只改变大小变化方向，不改变速度、方向和计划路程。</text><g transform="translate(0 100)"><path d="M 535 88 L 535 150" fill="none" stroke="#63748a" stroke-width="2.2" marker-end="url(#arrow)"/>

<text x="175" y="782" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">有机会：复位</text>
<text x="175" y="810" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">回到瞄准</text>
<rect x="410" y="750" width="250" height="78" rx="12" fill="#fff0ee" stroke="#bc564b" stroke-width="2"/>
<text x="535" y="782" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">无机会：关卡失败</text>
<text x="535" y="810" text-anchor="middle" font-size="20" font-weight="400" fill="#20334e">查看结果 / 重开</text>
<text x="30" y="982" font-size="18" fill="#5b6c82">暂停时保留原位置和大小；恢复后继续。成功或关卡失败后，重开回到准备关卡。</text></g><text x="30" y="1157" font-size="15" fill="#7b8797">数学桌球 · 简明版 · 2026-10-04</text></g></svg>
<rect x="509" y="377" width="52" height="26" rx="5" fill="#f8fafd"/><text x="535" y="396" text-anchor="middle" font-size="16" fill="#506079">松开</text>
<path d="M 660 479 L 790 479" fill="none" stroke="#63748a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="682" y="452" width="86" height="26" rx="5" fill="#f8fafd"/><text x="725" y="471" text-anchor="middle" font-size="16" fill="#506079">达到目标</text>
<path d="M 535 518 L 535 590" fill="none" stroke="#63748a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="458" y="527" width="154" height="26" rx="5" fill="#f8fafd"/><text x="535" y="546" text-anchor="middle" font-size="16" fill="#506079">越界 / 未成功</text>
<path d="M 535 668 L 535 709 L 175 709 L 175 750" fill="none" stroke="#63748a" stroke-width="2.2" marker-end="url(#arrow)"/>

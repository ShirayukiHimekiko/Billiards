<rect x="12" y="457" width="52" height="26" rx="5" fill="#f8fafd"/><text x="38" y="476" text-anchor="middle" font-size="16" fill="#506079">继续</text>
<rect x="410" y="10" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="56" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">准备关卡</text>
<rect x="410" y="140" width="250" height="78" rx="12" fill="#eaf2ff" stroke="#4274c4" stroke-width="2"/>
<text x="535" y="186" text-anchor="middle" font-size="20" font-weight="600" fill="#20334e">瞄准</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1170" viewBox="0 0 1100 1170"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#63748a"/></marker></defs><rect width="100%" height="100%" fill="#f8fafd"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="30" y="43" font-size="29" font-weight="700" fill="#172b47">游戏有哪些阶段</text><text x="30" y="77" font-size="18" fill="#5b6c82">每个阶段只允许对应操作，避免重复出杆或重复结算。</text><g transform="translate(0 100)"><path d="M 535 88 L 535 140" fill="none" stroke="#63748a" stroke-width="2.2" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><rect width="1200" height="610" fill="#f8fafd"/><g font-family="Microsoft YaHei, sans-serif" fill="#20334e"><text x="40" y="55" font-size="30" font-weight="700">两种通关目标</text><text x="40" y="91" font-size="19">蓝色圆周表示白球边缘，绿色三角形表示目标。</text><rect x="35" y="120" width="540" height="450" rx="15" fill="#edf4ff"/><rect x="625" y="120" width="540" height="450" rx="15" fill="#edf7f2"/><text x="300" y="163" text-anchor="middle" font-size="26" font-weight="700">内切：圆在三角形里面</text><text x="895" y="163" text-anchor="middle" font-size="26" font-weight="700">外接：三角形在圆里面</text><polygon points="300,225 196.077,405 403.923,405" fill="#d8ede4" stroke="#238064" stroke-width="4"/><circle cx="300" cy="345" r="60" fill="white" stroke="#4274c4" stroke-width="4"/><circle cx="895" cy="345" r="120" fill="white" stroke="#4274c4" stroke-width="4"/><polygon points="895,225 791.077,405 998.923,405" fill="#d8ede4" fill-opacity="0.7" stroke="#238064" stroke-width="4"/><text x="300" y="510" text-anchor="middle" font-size="22">圆周同时贴住三条边</text><text x="895" y="510" text-anchor="middle" font-size="22">三个顶点同时落在圆周上</text><text x="600" y="600" text-anchor="middle" font-size="17" fill="#5b6c82">完成任意一种即可通关；只是进入或罩住三角形还不够。</text></g></svg>